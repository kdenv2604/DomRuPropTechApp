name: Проверка iOS-проекта

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Кеш официального архива MobileVLCKit
        uses: actions/cache@v4
        with:
          path: ios/Vendor/MobileVLCKit-3.7.3.tar.xz
          key: mobilevlckit-3.7.3-0d040599
      - name: Подготовка видеоплеера
        run: bash scripts/bootstrap-vlc.sh
      - name: Выбор установленного симулятора
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "IOS_TEST_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Сборка и тесты
        run: |
          xcodebuild -project DomruTechnics.xcodeproj -scheme DomruTechnics \
            -destination "platform=iOS Simulator,id=$IOS_TEST_DEVICE" \
            -derivedDataPath build -resultBundlePath build-tests.xcresult \
            CODE_SIGN_IDENTITY=- test
      - name: Сборка для iPhone без подписи
        run: |
          xcodebuild -project DomruTechnics.xcodeproj -scheme DomruTechnics \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Результаты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/build-tests.xcresult
