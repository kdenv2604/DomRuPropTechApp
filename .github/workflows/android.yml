name: Проверка Android-проекта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Тесты, Lint и APK
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Подготовка Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Подготовка постоянной подписи APK
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.DOMRU_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/domru-debug.keystore"
          echo "DOMRU_DEBUG_KEYSTORE=$RUNNER_TEMP/domru-debug.keystore" >> "$GITHUB_ENV"

      - name: Проверка проекта
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Сохранение проверочного APK
        uses: actions/upload-artifact@v4
        with:
          name: lk.proptech.ru-debug
          path: app/build/outputs/apk/debug/app-debug.apk
